services:
  pl-radar:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+pysqlite:////app/backend/data/pl_radar.db
      SYNC_ON_STARTUP: "true"
      AUTO_CREATE_SCHEMA: "true"
      SYNC_INTERVAL_SECONDS: "21600"
      REQUEST_TIMEOUT_SECONDS: "45"
      CORS_ORIGINS: "*"
    volumes:
      - pl_radar_data:/app/backend/data
    restart: unless-stopped
volumes:
  pl_radar_data:
